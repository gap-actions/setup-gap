name: CI

# Trigger the workflow on push to master / main, or on pull request
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: ${{ matrix.gap-version }} on ${{ matrix.os }} with ${{ !matrix.configflags && 'system GMP' || 'builtin GMP'}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        gap-version:
          - 'devel'
          - '4.16'
          - '4.15'
          - '4.14'
          - '4.13'
          - '4.12'
          - '4.11'
          - '4.10'
          - '4.9'
        configflags: ['', '--with-gmp=builtin']
        exclude:
          - os: windows-latest
            configflags: '--with-gmp=builtin'
          - os: macos-latest
            configflags: '--with-gmp=builtin'
        include:
          - os: ubuntu-latest
            gap-version: minimal
            configflags: ''
          - os: ubuntu-latest
            gap-version: latest
            configflags: ''
          - os: ubuntu-latest
            gap-version: stable-4.15
            configflags: ''
          - os: ubuntu-latest
            gap-version: v4.11.1
            configflags: ''
          - os: ubuntu-latest
            gap-version: 4
            configflags: ''
          - os: ubuntu-latest
            gap-version: 4.15.0-beta1
            configflags: ''
          - os: ubuntu-latest
            gap-version: 'Custom archive'
            configflags: ''
            custom-archive: >-
              https://github.com/gap-system/gap/releases/download/v4.16.1/gap-4.16.1.tar.gz
              df7d116f03c426dac24bf7c76ea11416b29c5a48eac12f97811d80ec215f7f69

    steps:
      - name: "Clone the Example package"
        uses: actions/checkout@v7
        if: ${{ matrix.gap-version == 'minimal' }}
        with:
          repository: gap-packages/example

      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          path: this-action/

      - name: "Setup Cygwin"
        if: ${{ matrix.os == 'windows-latest' }}
        uses: gap-actions/setup-cygwin@v2

      - name: "Setup GAP"
        uses: ./this-action/
        with:
          gap-version: ${{ matrix.gap-version }}
          configflags: ${{ matrix.configflags }}
          custom-archive: ${{ matrix.custom-archive }}

      - name: "Check if GAP can run"
        shell: bash
        run: |
          gap -A <<GAPINPUT
            quit;
          GAPINPUT
          $GAP -A <<GAPINPUT
            quit;
          GAPINPUT
          $GAPROOT/gap -A <<GAPINPUT
            quit;
          GAPINPUT
